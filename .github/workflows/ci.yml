name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 测试 · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 覆盖最低支持版本和最新版本，中间的没必要重复跑
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装项目
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: 检索评测（离线，不调模型）
        run: python scripts/evaluate.py --retrieval --min-recall 0.85

      - name: 离线演示冒烟（不访问 GitHub）
        run: python -m devprism analyze google/gson --demo --out /tmp/demo-report.md

      - name: 密钥自检
        run: python scripts/check_secrets.py

  web:
    name: Web 控制台
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Web 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"

      - name: 构建应用
        run: python -c "from devprism.web import build_app; app = build_app(); print('路由数', len(app.routes))"

      - name: 首页能渲染
        run: python -c "from devprism.config import ROOT; html = (ROOT / 'web' / 'index.html').read_text(encoding='utf-8'); assert 'galaxy' in html; print('页面', len(html), '字节')"
